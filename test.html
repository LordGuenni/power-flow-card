<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Power Flow Card - Local Test</title>
    <style>
      :root {
        --primary-color: #03a9f4;
        --success-color: #4caf50;
        --error-color: #f44336;
        --warning-color: #ff9800;
      }

      body {
        background-color: #111;
        color: #fff;
        font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        padding: 20px;
        margin: 0;
        transition: background-color 0.3s, color 0.3s;
      }
      
      body.light-mode {
        background-color: #e2e8f0; 
        color: #111;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
      }

      h1 {
        text-align: center;
        margin-bottom: 20px;
      }

      .controls {
        background: #1a1a1a;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 30px;
        transition: background-color 0.3s;
      }
      
      body.light-mode .controls {
        background: #ffffff;
        box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
      }

      .grid-controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 16px;
      }

      .section-box {
        background: #222;
        padding: 12px 16px;
        border-radius: 6px;
        border: 1px solid #333;
        transition: background-color 0.3s, border-color 0.3s;
      }
      
      body.light-mode .section-box {
        background: #f8fafc;
        border-color: #e2e8f0;
      }

      .section-title {
        font-size: 15px;
        font-weight: bold;
        margin-bottom: 12px;
        color: #4facfe;
        border-bottom: 1px solid #333;
        padding-bottom: 6px;
      }
      
      body.light-mode .section-title {
        border-bottom-color: #cbd5e1;
      }

      .control-group {
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      label {
        font-weight: 500;
        font-size: 13px;
        color: #ddd;
      }
      
      body.light-mode label {
        color: #334155;
      }

      input[type="number"], input[type="text"] {
        width: 110px;
        padding: 6px 8px;
        background: #2a2a2a;
        border: 1px solid #444;
        color: #fff;
        border-radius: 4px;
        box-sizing: border-box;
      }
      
      body.light-mode input {
        background: #fff;
        color: #000;
        border-color: #cbd5e1;
      }

      input[type="checkbox"] {
        width: 18px;
        height: 18px;
        cursor: pointer;
      }

      .btn-bar {
        margin-top: 20px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        border-top: 1px solid #333;
        padding-top: 20px;
      }
      
      body.light-mode .btn-bar {
        border-top-color: #e2e8f0;
      }

      button {
        padding: 8px 16px;
        background: #0366d6;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
      }

      button:hover {
        background: #0256c4;
      }

      button.secondary {
        background: #444;
      }

      button.secondary:hover {
        background: #555;
      }
      
      body.light-mode button.secondary {
        background: #94a3b8;
      }
      body.light-mode button.secondary:hover {
        background: #64748b;
      }

      power-flow-card {
        display: block;
        max-width: 600px;
        margin: 0 auto;
      }

      /* Native HA Card Simulation */
      ha-card {
        background: #1c1c1e;
        border-radius: 16px;
        color: var(--primary-text-color, #ffffff);
        display: block;
        transition: all 0.3s ease-out;
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0px 2px 4px -1px rgba(0,0,0,0.2);
      }

      ha-card.theme-light {
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        background: #ffffff !important;
        border: 1px solid #e0e0e0;
      }

      ha-card.theme-dark {
        --primary-text-color: #ffffff;
        --secondary-text-color: #9aa0a6;
        background: #1c1c1e !important;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Power Flow Card - Local Test</h1>
      
      <div class="controls">
        <div class="grid-controls">
          
          <!-- Primary Power Values -->
          <div class="section-box">
            <div class="section-title">Primary Power (W)</div>
            <div class="control-group">
              <label>Solar Power:</label>
              <input type="number" id="solar" value="4400" step="50" />
            </div>
            <div class="control-group">
              <label>Grid Import:</label>
              <input type="number" id="grid-import" value="452" step="50" />
            </div>
            <div class="control-group">
              <label>Grid Export:</label>
              <input type="number" id="grid-export" value="0" step="50" />
            </div>
            <div class="control-group">
              <label>Battery Charge:</label>
              <input type="number" id="battery-charge" value="2200" step="50" />
            </div>
            <div class="control-group">
              <label>Battery Discharge:</label>
              <input type="number" id="battery-discharge" value="0" step="50" />
            </div>
            <div class="control-group">
              <label>EV Charge:</label>
              <input type="number" id="ev-charge" value="8600" step="100" />
            </div>
          </div>

          <!-- Secondary Entities -->
          <div class="section-box">
            <div class="section-title">Secondary Entities</div>
            <div class="control-group">
              <label>PV Savings ($/£):</label>
              <input type="text" id="pv-savings" value="$0.03" />
            </div>
            <div class="control-group">
              <label>Grid Daily Cost (£):</label>
              <input type="text" id="grid-cost" value="£2.45" />
            </div>
            <div class="control-group">
              <label>Battery SOC (%):</label>
              <input type="number" id="battery-soc" value="86" min="0" max="100" />
            </div>
            <div class="control-group">
              <label>EV Battery SOC (%):</label>
              <input type="number" id="ev-soc" value="64" min="0" max="100" />
            </div>
            <div class="control-group">
              <label>Home Demand (W):</label>
              <input type="number" id="home-demand" value="790" step="10" />
            </div>
            <div class="control-group">
              <label>Invert Battery Flow:</label>
              <input type="checkbox" id="invert-battery-flow" />
            </div>
          </div>

          <!-- Formatting & Animation -->
          <div class="section-box">
            <div class="section-title">Formatting & Animation</div>
            <div class="control-group">
              <label>Auto-kW Threshold (W):</label>
              <input type="number" id="auto-kw-threshold" value="1000" step="100" />
            </div>
            <div class="control-group">
              <label>Decimals for W:</label>
              <input type="number" id="decimals-w" value="0" min="0" max="4" />
            </div>
            <div class="control-group">
              <label>Decimals for kW:</label>
              <input type="number" id="decimals-kw" value="1" min="0" max="4" />
            </div>
            <div class="control-group">
              <label>Active Threshold (W):</label>
              <input type="number" id="threshold" value="10" step="1" />
            </div>
            <div class="control-group">
              <label>Dynamic Speed:</label>
              <input type="checkbox" id="dynamic-speed" checked />
            </div>
            <div class="control-group">
              <label>Min Speed (s):</label>
              <input type="number" id="min-speed" value="5" step="0.5" />
            </div>
            <div class="control-group">
              <label>Max Speed (s):</label>
              <input type="number" id="max-speed" value="1" step="0.1" />
            </div>
          </div>

          <!-- Theming & Typography -->
          <div class="section-box">
            <div class="section-title">Theming & Typography</div>
            <div class="control-group">
              <label>Primary Font (px):</label>
              <input type="number" id="primary-font-size" value="34" min="16" max="60" />
            </div>
            <div class="control-group">
              <label>Secondary Font (px):</label>
              <input type="number" id="secondary-font-size" value="28" min="14" max="50" />
            </div>
            <div class="control-group">
              <label>House Color (Dark):</label>
              <input type="text" id="house-color-dark" value="" placeholder="#4a5976" />
            </div>
            <div class="control-group">
              <label>Roof Color (Dark):</label>
              <input type="text" id="roof-color-dark" value="" placeholder="#3b465e" />
            </div>
            <div class="control-group">
              <label>House Color (Light):</label>
              <input type="text" id="house-color-light" value="" placeholder="#dce1e8" />
            </div>
            <div class="control-group">
              <label>Roof Color (Light):</label>
              <input type="text" id="roof-color-light" value="" placeholder="#c8d0db" />
            </div>
          </div>

        </div>

        <div class="btn-bar">
          <button onclick="updateValues()">Apply Values</button>
          <button onclick="updateConfig()">Apply Settings</button>
          <button class="secondary" onclick="toggleTheme()">Toggle Theme</button>
          <button onclick="startDemo()">Start Demo</button>
          <button class="secondary" onclick="stopDemo()">Stop Demo</button>
        </div>
      </div>

      <!-- Card Container -->
      <power-flow-card id="card"></power-flow-card>
      
      <p style="text-align:center; color: #888; font-size: 12px; margin-top: 20px;">
        *Click any text descriptor to log the `tap_entity` target to the browser console.
      </p>
    </div>

    <script type="module">
      import './power-flow-card.js';

      // --- MOCK HOME ASSISTANT HA-ICON COMPONENT ---
      class HaIcon extends HTMLElement {
        static get observedAttributes() { return ['icon']; }
        attributeChangedCallback() { this.render(); }
        connectedCallback() { this.render(); }
        render() {
          const icon = this.getAttribute('icon') || '';
          let symbol = '⚡';
          if (icon.includes('battery')) {
            const match = icon.match(/battery-(\d+)/);
            if (match) {
              const pct = parseInt(match[1], 10);
              symbol = pct > 60 ? '🔋' : pct > 20 ? '🪫' : '⚠️';
            } else if (icon.includes('outline')) {
              symbol = '🪫';
            } else {
              symbol = '🔋';
            }
          } else if (icon.includes('currency') || icon.includes('cash') || icon.includes('pound') || icon.includes('gbp')) {
            symbol = '£';
          } else if (icon.includes('solar') || icon.includes('sun')) {
            symbol = '☀️';
          } else if (icon.includes('car') || icon.includes('ev')) {
            symbol = '🚗';
          } else if (icon.includes('home') || icon.includes('house')) {
            symbol = '🏠';
          } else if (icon.includes('leaf')) {
            symbol = '🍃';
          }
          this.innerHTML = `<span style="font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;">${symbol}</span>`;
        }
      }
      if (!customElements.get('ha-icon')) {
        customElements.define('ha-icon', HaIcon);
      }

      // --- MOCK HOME ASSISTANT HA-CARD COMPONENT ---
      class HaCard extends HTMLElement {
        connectedCallback() {
          if (this.hasAttribute('header') && !this.querySelector('.card-header')) {
            const header = document.createElement('div');
            header.className = 'card-header';
            header.textContent = this.getAttribute('header');
            header.style.padding = '24px 16px 16px';
            header.style.fontSize = '24px';
            header.style.fontWeight = '400';
            header.style.color = 'var(--primary-text-color)';
            this.prepend(header);
          }
        }
      }
      if (!customElements.get('ha-card')) {
        customElements.define('ha-card', HaCard);
      }

      // Mock Home Assistant hass object
      const mockHass = {
        themes: { darkMode: true },
        states: {
          'sensor.solar_power': { state: '4400', attributes: { unit_of_measurement: 'W' } },
          'sensor.solar_daily_yield': { state: '$0.03', attributes: { unit_of_measurement: '£' } }, 
          'sensor.grid_import_power': { state: '452', attributes: { unit_of_measurement: 'W' } },
          'sensor.grid_export_power': { state: '0', attributes: { unit_of_measurement: 'W' } },
          'sensor.grid_daily_cost': { state: '£2.45', attributes: { unit_of_measurement: '£' } },
          'sensor.battery_charge_power': { state: '2200', attributes: { unit_of_measurement: 'W' } },
          'sensor.battery_discharge_power': { state: '0', attributes: { unit_of_measurement: 'W' } },
          'sensor.battery_soc': { state: '86', attributes: { unit_of_measurement: '%' } },
          'sensor.ev_charge_power': { state: '8600', attributes: { unit_of_measurement: 'W' } },
          'sensor.ev_battery_soc': { state: '64', attributes: { unit_of_measurement: '%' } },
          'sensor.home_consumption': { state: '790', attributes: { unit_of_measurement: 'W' } }
        }
      };

      // Card configuration matching your testing constraints
      let config = {
        name: 'Home Power Flow',
        threshold: 10,
        dynamic_speed_enabled: true,
        min_flow_speed: 5,
        max_flow_speed: 1,
        min_power_threshold: 100,
        max_power_threshold: 10000,
        primary_font_size: 34,
        secondary_font_size: 28,
        auto_kw_threshold: 1000,
        decimals_w: 0,
        decimals_kw: 1,
        invert_battery_flow: false,
        
        entities: {
          solar_power: 'sensor.solar_power',
          grid_import_power: 'sensor.grid_import_power',
          grid_export_power: 'sensor.grid_export_power',
          battery_charge_power: 'sensor.battery_charge_power',
          battery_discharge_power: 'sensor.battery_discharge_power',
          ev_charge_power: 'sensor.ev_charge_power'
        },

        solar_descriptor_enabled: true,
        solar_descriptor_label: 'PV',
        solar_descriptor_entity: 'sensor.solar_power',
        solar_secondary_entity: 'sensor.solar_daily_yield',
        solar_secondary_display_unit: '£', // Tests regex replacement!
        
        grid_descriptor_enabled: true,
        grid_descriptor_label: 'Grid',
        grid_descriptor_entity: 'sensor.grid_import_power',
        grid_secondary_entity: 'sensor.grid_daily_cost',
        grid_secondary_display_unit: '£',
        grid_secondary_icon: 'mdi:currency-gbp',

        battery_descriptor_enabled: true,
        battery_descriptor_label: 'Ecoflow',
        battery_descriptor_entity: 'sensor.battery_charge_power',
        battery_secondary_entity: 'sensor.battery_soc',
        battery_secondary_display_unit: '%',
        battery_secondary_icon: 'mdi:battery',

        ev_descriptor_enabled: true,
        ev_descriptor_label: 'Skoda',
        ev_descriptor_entity: 'sensor.ev_charge_power',
        ev_secondary_entity: 'sensor.ev_battery_soc',
        ev_secondary_display_unit: '%',
        ev_secondary_icon: 'mdi:car-electric',

        home_descriptor_enabled: true,
        home_descriptor_label: 'Consumption',
        home_descriptor_entity: 'sensor.home_consumption'
      };

      // Initialize card
      const card = document.getElementById('card');
      card.setConfig(config);
      card.hass = mockHass;

      window.updateValues = function() {
        // Update Primary Powers
        mockHass.states['sensor.solar_power'].state = document.getElementById('solar').value;
        mockHass.states['sensor.grid_import_power'].state = document.getElementById('grid-import').value;
        mockHass.states['sensor.grid_export_power'].state = document.getElementById('grid-export').value;
        mockHass.states['sensor.ev_charge_power'].state = document.getElementById('ev-charge').value;
        mockHass.states['sensor.home_consumption'].state = document.getElementById('home-demand').value;
        
        const batCharge = parseFloat(document.getElementById('battery-charge').value) || 0;
        const batDischarge = parseFloat(document.getElementById('battery-discharge').value) || 0;
        mockHass.states['sensor.battery_charge_power'].state = batCharge > 0 ? batCharge.toString() : (-batDischarge).toString();
        mockHass.states['sensor.battery_discharge_power'].state = batDischarge.toString();
        
        // Update Secondary Info
        mockHass.states['sensor.solar_daily_yield'].state = document.getElementById('pv-savings').value;
        mockHass.states['sensor.grid_daily_cost'].state = document.getElementById('grid-cost').value;
        mockHass.states['sensor.battery_soc'].state = document.getElementById('battery-soc').value;
        mockHass.states['sensor.ev_battery_soc'].state = document.getElementById('ev-soc').value;

        card.hass = { ...mockHass };
      };

      window.updateConfig = function() {
        // Standard Toggles
        config.dynamic_speed_enabled = document.getElementById('dynamic-speed').checked;
        config.invert_battery_flow = document.getElementById('invert-battery-flow').checked;
        
        // Sliders & Numbers
        config.min_flow_speed = parseFloat(document.getElementById('min-speed').value);
        config.max_flow_speed = parseFloat(document.getElementById('max-speed').value);
        config.threshold = parseFloat(document.getElementById('threshold').value);
        config.primary_font_size = parseInt(document.getElementById('primary-font-size').value, 10);
        config.secondary_font_size = parseInt(document.getElementById('secondary-font-size').value, 10);
        config.auto_kw_threshold = parseFloat(document.getElementById('auto-kw-threshold').value);
        config.decimals_w = parseInt(document.getElementById('decimals-w').value, 10);
        config.decimals_kw = parseInt(document.getElementById('decimals-kw').value, 10);

        // Styling Variables
        const hcd = document.getElementById('house-color-dark').value.trim();
        const rcd = document.getElementById('roof-color-dark').value.trim();
        const hcl = document.getElementById('house-color-light').value.trim();
        const rcl = document.getElementById('roof-color-light').value.trim();

        if (hcd) config.house_color_dark = hcd; else delete config.house_color_dark;
        if (rcd) config.roof_color_dark = rcd; else delete config.roof_color_dark;
        if (hcl) config.house_color_light = hcl; else delete config.house_color_light;
        if (rcl) config.roof_color_light = rcl; else delete config.roof_color_light;

        card.setConfig({ ...config });
        setTimeout(() => { card.hass = { ...mockHass }; }, 10);
      };

      window.toggleTheme = function() {
        const isDark = mockHass.themes.darkMode;
        mockHass.themes.darkMode = !isDark;
        
        // Toggle the body class to update background and input fields
        document.body.classList.toggle('light-mode', !mockHass.themes.darkMode);
        
        card.hass = { ...mockHass };
      };

      let demoInterval;
      window.startDemo = function() {
        stopDemo();
        let counter = 0;
        demoInterval = setInterval(() => {
          counter += 0.08;
          const solar = Math.max(0, 3500 + Math.sin(counter) * 2500);
          const gridImport = Math.max(0, 600 + Math.cos(counter * 1.2) * 500);
          const battery = Math.max(0, 1500 + Math.sin(counter * 0.7) * 1200);
          const ev = Math.max(0, 6500 + Math.cos(counter * 0.4) * 3500);
          const soc = Math.round(50 + Math.sin(counter * 0.2) * 45);

          document.getElementById('solar').value = Math.round(solar);
          document.getElementById('grid-import').value = Math.round(gridImport);
          document.getElementById('battery-charge').value = Math.round(battery);
          document.getElementById('ev-charge').value = Math.round(ev);
          document.getElementById('battery-soc').value = soc;

          updateValues();
        }, 120);
      };

      window.stopDemo = function() {
        if (demoInterval) {
          clearInterval(demoInterval);
          demoInterval = null;
        }
      };

      document.addEventListener('hass-more-info', (e) => {
        console.log(`[simulated-ha] Popup triggered for: ${e.detail.entityId}`);
        alert(`Home Assistant would open more-info for:\n\n${e.detail.entityId}`);
      });
    </script>
  </body>
</html>
